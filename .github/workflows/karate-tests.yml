name: Karate API Tests

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Karate tag filter (e.g. @smoke, @regression, @HU-001)'
        required: false
        default: '@smoke'
      environment:
        description: 'Target environment'
        required: false
        default: 'qa'
        type: choice
        options:
          - qa
          - local

jobs:
  karate-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Karate tests with tag [${{ github.event.inputs.tag }}]
        run: |
          mvn test \
            -Dtest=com.demo.qa.api.TestParallel#testParallel \
            -Dkarate.env=${{ github.event.inputs.environment }} \
            "-Dkarate.options=--tags ${{ github.event.inputs.tag }}" \
            -Dsurefire.useFile=false
        continue-on-error: true

      - name: Merge Karate JSONs into cucumber.json
        if: always()
        run: |
          echo '[]' > /tmp/merged.json
          for f in target/karate-reports/com.demo.*.json; do
            if [ -f "$f" ]; then
              jq -s '.[0] + .[1]' /tmp/merged.json "$f" > /tmp/merged2.json
              mv /tmp/merged2.json /tmp/merged.json
            fi
          done
          cp /tmp/merged.json target/karate-reports/cucumber.json
          MERGED_COUNT=$(ls target/karate-reports/com.demo.*.json 2>/dev/null | wc -l)
          TOTAL=$(jq '[.[].elements[]? | select(.type == "scenario")] | length' target/karate-reports/cucumber.json)
          echo "Merged $MERGED_COUNT feature JSONs into cucumber.json ($TOTAL scenarios)"

      - name: Upload Karate HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-html-report
          path: target/karate-reports/
          retention-days: 14

      - name: Upload cucumber.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-json
          path: target/karate-reports/cucumber.json
          retention-days: 14

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

